name: postgres_tls
description: >-
  TLS for package:postgres connections, run natively by tls.zig instead of
  dart:io's SecureSocket.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  code_assets: ^2.0.0
  ffi: ^2.1.0
  hooks: ^2.2.0

dev_dependencies:
  lints: ^6.0.0
  postgres: ^3.5.12
  test: ^1.25.0
  zig_hook:
    path: ../../../../byolimit/dart/zig_hook/dart

zig_hook:
  # Zig 0.17's std.Io.Threaded does not compile for iOS.
  exclude: [ios-arm64, ios-arm64-simulator, ios-x64-simulator]
  cpu:
    x64: x86_64_v2+aes+pclmul+avx
    arm64: generic+aes+sha2
